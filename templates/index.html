<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Computational Thinking</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div id="eval-overlay" class="hidden">
        <div class="eval-box">
            <div class="eval-header">
                <span class="eval-title">학습 단계 평가 결과</span>
                <span class="eval-topic-tag" id="eval-topic"></span>
            </div>
            <div class="eval-card eval-card-evidence">
                <h3 class="eval-card-title">평가 근거 — 내 대화의 어떤 부분이 어떻게 평가됐나요?</h3>
                <p class="eval-evidence-sub">내가 한 말 중에서 컴퓨팅 사고력으로 평가된 발화와, 그것이 어떤 요소에서 어떻게 평가됐는지 보여줘요.</p>
                <div class="ct-evidence" id="ct-evidence"></div>
            </div>
            <button class="eval-next-btn" onclick="closeEvalAndRestart()">다음 주제 →</button>
        </div>
    </div>

    <div id="loading-overlay">
        <div class="loading-box">
            <div class="spinner"></div>
            <p id="loading-text">코드 만드는 중...</p>
        </div>
    </div>

    <!-- 유형 2(순서도): 보기를 클릭하면 이 창에 순서도를 크게 보여준다 -->
    <div id="diagram-overlay" class="hidden">
        <div class="diagram-modal">
            <div class="diagram-modal-header">
                <span id="diagram-modal-title">보기</span>
                <button class="diagram-close" onclick="closeDiagramModal()">✕</button>
            </div>
            <div id="diagram-modal-body" class="diagram-modal-body"></div>
            <div class="diagram-modal-footer">
                <button id="diagram-select-btn" onclick="selectFromModal()">이 순서도를 정답으로 선택</button>
            </div>
        </div>
    </div>

    <div class="grid">

        <div class="quadrant code-panel">
            <div class="quadrant-header">
                <span class="label">코드 예제</span>
                <button onclick="generateCode()">새 코드</button>
            </div>
            <pre id="code-display"><code></code></pre>
        </div>

        <div class="quadrant problem-panel">
            <div class="quadrant-header">
                <span class="label">문제</span>
                <span id="problem-count" class="problem-count"></span>
            </div>
            <div id="problem-display" class="text-display placeholder"></div>
            <div id="answer-area" class="answer-area">
                <div id="options-list" class="options-list"></div>
                <div class="answer-submit-row" id="answer-submit-row">
                    <button id="submit-btn" onclick="submitAnswer()" disabled>제출</button>
                </div>
                <div id="feedback-area" class="hidden">
                    <div id="feedback-badge" class="feedback-badge"></div>
                    <p id="feedback-explanation" class="feedback-explanation"></p>
                    <button id="next-problem-btn" onclick="nextProblem()">다음 문제 →</button>
                </div>
            </div>
        </div>

        <div class="quadrant chat-panel">
            <div class="quadrant-header">
                <span class="label">챗봇</span>
            </div>
            <div id="chat-messages"></div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="메시지를 입력하세요..." onkeydown="if(event.key==='Enter') sendMessage()">
                <button onclick="sendMessage()">전송</button>
            </div>
        </div>

    </div>
    <!-- 유형 2(순서도) 보기 렌더용 Mermaid (CDN). 오프라인이면 보기는 원본 텍스트로 폴백된다. -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <script>
        if (window.mermaid) {
            mermaid.initialize({ startOnLoad: false, theme: "default", flowchart: { useMaxWidth: true } });
        }
    </script>
    <script src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
