<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Computational Thinking</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div id="session-start-overlay" class="hidden">
        <div class="session-start-box">
            <div class="session-start-header">
                <span class="session-start-title">지난 학습 결과</span>
                <span class="eval-topic-tag" id="prev-topic"></span>
            </div>
            <div class="ct-bar-list" id="prev-ct-scores"></div>
            <div id="weak-ct-tip" class="weak-ct-tip hidden"></div>
            <button class="session-start-btn" onclick="startLearning()">학습 시작 →</button>
        </div>
    </div>

    <div id="eval-overlay" class="hidden">
        <div class="eval-box">
            <div class="eval-header">
                <span class="eval-title">학습 단계 평가 결과</span>
                <span class="eval-topic-tag" id="eval-topic"></span>
            </div>
            <div class="eval-cards">
                <div class="eval-card">
                    <div class="score-ring" id="ct-score-ring">
                        <span id="ct-score">-</span>
                        <span class="score-label">점</span>
                    </div>
                    <h3 class="eval-card-title">컴퓨팅 사고력</h3>
                    <p class="eval-feedback" id="ct-feedback"></p>
                </div>
                <div class="eval-card">
                    <div class="score-ring" id="prompt-score-ring">
                        <span id="prompt-score">-</span>
                        <span class="score-label">점</span>
                    </div>
                    <h3 class="eval-card-title">프롬프팅 품질</h3>
                    <p class="eval-feedback" id="prompt-feedback"></p>
                </div>
            </div>
            <div class="ct-breakdown-section" id="ct-breakdown-section">
                <h3 class="ct-breakdown-title">컴퓨팅 사고력 7지표 분석</h3>
                <div class="ct-breakdown-list" id="ct-breakdown"></div>
            </div>
            <button class="eval-next-btn" onclick="closeEvalAndRestart()">다음 주제 →</button>
        </div>
    </div>

    <div id="loading-overlay">
        <div class="loading-box">
            <div class="spinner"></div>
            <p id="loading-text">코드 만드는 중...</p>
        </div>
    </div>

    <div class="grid">

        <div class="quadrant code-panel">
            <div class="quadrant-header">
                <span class="label">코드 예제 — <span id="topic-label" style="color:#4f6ef7;font-weight:700;"></span></span>
                <button onclick="skipToNext()">다음 단계</button>
            </div>
            <pre id="code-display"><code></code></pre>
        </div>

        <div class="quadrant problem-panel">
            <div class="quadrant-header">
                <span class="label">문제</span>
                <span id="problem-count" class="problem-count"></span>
            </div>
            <div id="problem-display" class="text-display placeholder"></div>
            <div id="answer-area" class="answer-area">
                <div id="options-list" class="options-list"></div>
                <div class="answer-submit-row" id="answer-submit-row">
                    <button id="submit-btn" onclick="submitAnswer()" disabled>제출</button>
                </div>
                <div id="feedback-area" class="hidden">
                    <div id="feedback-badge" class="feedback-badge"></div>
                    <p id="feedback-explanation" class="feedback-explanation"></p>
                    <div class="feedback-actions">
                        <button id="ack-btn" class="ack-btn hidden" onclick="acknowledgeWrong()">다시 풀기 ↩</button>
                        <button id="next-btn" class="hidden" onclick="nextProblem()">다음 문제 →</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="quadrant chat-panel">
            <div class="quadrant-header">
                <span class="label">챗봇</span>
                <span id="chat-count" class="chat-count-badge">0 / 6회</span>
                <span id="lm-status" class="lm-status">● 연결 확인 중...</span>
            </div>
            <div id="chat-messages"></div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="메시지를 입력하세요..." onkeydown="if(event.key==='Enter') sendMessage()">
                <button onclick="sendMessage()">전송</button>
            </div>
        </div>

    </div>
    <script src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
